<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verifica tu correo</title>
  </head>
  <body
    style="font-family: Arial, sans-serif; color: #1f1f1f; line-height: 1.5"
  >
    <h2>Verifica tu correo</h2>
    <p>Gracias por crear tu cuenta en Excalidraw.</p>
    <p>
      Haz clic en el siguiente enlace para confirmar que este correo te
      pertenece:
    </p>
    <p>
      <a href="{{ .SiteURL }}?type=signup&amp;token_hash={{ .TokenHash }}"
        >Verificar correo</a
      >
    </p>
    <p>
      Este enlace caduca por seguridad. Si ya solicitaste otro correo, usa el
      enlace más reciente.
    </p>
  </body>
</html>
